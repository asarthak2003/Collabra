name: Build Backend Image & Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/collabra-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/collabra-backend:${{ github.sha }}

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render Deploy Hook..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "Render deploy triggered successfully! (HTTP $response)"
          else
            echo "Failed to trigger Render deployment! (HTTP $response)"
            exit 1
          fi
